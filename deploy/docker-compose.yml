# Local infrastructure for FileChat: MySQL, Elasticsearch and Neo4j.
#
#   cp .env.example .env        # then fill in MySQL_PASSWORD, ELASTICSEARCH_PASSWORD and NEO4J_PASSWORD
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d
#
# There are no default passwords: compose refuses to start until you set them.
# Ports are published on 127.0.0.1 only. Do not change that without putting real network controls in front.
name: filechat

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MySQL_PASSWORD:?Set MySQL_PASSWORD in .env}
      MYSQL_DATABASE: file_chat_db
      # Optional: create one gateway API client for local use (see deploy/mysql/02-demo-client.sh)
      FILECHAT_DEMO_AUTH_ID: ${FILECHAT_DEMO_AUTH_ID:-}
      FILECHAT_DEMO_AUTH_SECRET: ${FILECHAT_DEMO_AUTH_SECRET:-}
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./mysql/02-demo-client.sh:/docker-entrypoint-initdb.d/02-demo-client.sh:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -uroot"]
      interval: 5s
      retries: 30

  elasticsearch:
    image: elasticsearch:8.18.0
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:?Set ELASTICSEARCH_PASSWORD in .env}
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports: ["127.0.0.1:9200:9200"]
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u \"elastic:$$ELASTIC_PASSWORD\" localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 5s
      retries: 60

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1'"]
      interval: 5s
      retries: 30

volumes:
  mysql-data:
  es-data:
  neo4j-data:
