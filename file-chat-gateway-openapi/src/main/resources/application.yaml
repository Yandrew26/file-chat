server:
  port: 8100
  tomcat:
    connection-timeout: 30s
    accept-count: 1000
    max-connections: 10000
    max-http-form-post-size: 50MB
    threads:
      max: 500
      min-spare: 50
    uri-encoding: UTF-8

spring:
  config:
    # Secrets come from the environment or a git-ignored .env in the directory you start the service from (see .env.example)
    import: optional:file:.env[.properties]
  application:
    name: file-chat-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  main:
    allow-bean-definition-overriding: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: always
    serialization:
      indent-output: true
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai
  output:
    ansi:
      enabled: never
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  cloud:
    loadbalancer:
      enabled: true
    gateway:
      server:
        webflux:
          routes:
            - id: file-chat-service-search
              uri: http://localhost:8081
              order: 9999
              predicates:
                - Path=/chat/**
              filters:
                - StripPrefix=1
                - AuthFilter
            - id: file-chat-service-upload
              uri: http://localhost:8082
              order: 9998
              predicates:
                - Path=/upload/**
              filters:
                # the upload service itself is mounted under /upload, so the prefix must be kept
                - AuthFilter