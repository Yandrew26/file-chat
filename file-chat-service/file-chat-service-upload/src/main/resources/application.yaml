server:
  port: 8082
  # Internal service: it has no authentication of its own (the gateway does that), so listen on loopback unless told otherwise
  address: ${FILECHAT_BIND_ADDRESS:127.0.0.1}
  servlet:
    encoding:
      charset: UTF-8
      force: true

filechat:
  upload:
    # Largest document that will be embedded, in passages of up to 1024 tokens; bounds the embedding cost per upload
    max-passages: ${FILECHAT_MAX_PASSAGES_PER_UPLOAD:300}

spring:
  config:
    # Secrets come from the environment or a git-ignored .env in the directory you start the service from (see .env.example)
    import: optional:file:.env[.properties]
  application:
    name: file-chat-service-upload
  messages:
    basename: i18n/messages
    encoding: UTF-8
  profiles:
    active: dev
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:elastic}
    password: ${ELASTICSEARCH_PASSWORD}
  ai:
    dashscope:
      api-key: ${API_KEY}
      base-url: https://dashscope.aliyuncs.com/
      chat:
        options:
          model: qwen-max
      embedding:
        options:
          model: text-embedding-v2
    vectorstore:
      elasticsearch:
        initialize-schema: true
        index-name: file-chat-index
        dimensions: 1536
        similarity: cosine
        embedding-field-name: embedding
        top-k: 5