server:
  port: 8081
  error:
    # Return ResponseStatusException reasons (e.g. "Only PDF files are supported") to the web client
    include-message: always

filechat:
  upload-service-url: http://localhost:8082

spring:
  application:
    name: file-chat-service-search
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/file_chat_db
    username: root
    password: ${MySQL_PASSWORD}
  ai:
    openai:
      api-key: ${API_KEY}
      # 阿里通义接入: https://help.aliyun.com/zh/model-studio/use-qwen-by-calling-api?spm=a2c4g.11186623.0.i1
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-max
    memory:
      self-mysql:
        jdbc-url: jdbc:mysql://localhost:3306/file_chat_db
        username: root
        password: ${MySQL_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
        enabled: true
  mybatis-plus:
    mapper-locations: classpath*:mapper/**/*.xml
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
      cache-enabled: false
      default-enum-type-handler: com.baomidou.mybatisplus.extension.handlers.EnumTypeHandler
    global-config:
      db-config:
        logic-delete-value: true
        logic-not-delete-value: false